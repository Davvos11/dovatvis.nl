server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html index.htm;
    disable_symlinks off;

    # Never serve dotfiles (.git, .idea, ...).
    location ~ /\. {
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Site files from the image; large/binary files from the files volume.
    location / {
        try_files $uri $uri/ @files;
    }

    location @files {
        root /srv/files;
    }

    # Recordings from the Google Drive mount on the host (read-only).
    location /het-bestand {
        alias /srv/gdrive/opnames;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
