apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace, its RBAC and the <app>-env Secret are managed by infra-tg (Terragrunt).
namespace: dovatvis-nl

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - het-bestand.yaml
  - httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/name: dovatvis-nl
    includeSelectors: true

# The deploy job sets newTag to the commit SHA (kustomize edit set image).
images:
  - name: app
    newName: ghcr.io/davvos11/dovatvis.nl
    newTag: latest
